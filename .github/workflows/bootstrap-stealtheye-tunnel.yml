name: Bootstrap StealthEye Tunnel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-stealtheye-tunnel.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-stealtheye-tunnel
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      SOURCE_TUNNEL_ID: tunnel_6a72b49594188191b8d5afbd59666b6b
      TUNNEL_NAME: StealthEye
      TUNNEL_DESCRIPTION: Direct laptop-native StealthEye MCP tunnel
      TUNNEL_API_BASE: https://api.openai.com
    steps:
      - name: Checkout StealthEye
        uses: actions/checkout@v4

      - name: Create or recover dedicated StealthEye tunnel
        shell: bash
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OAIADMIN }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_ADMIN_KEY:-}" ]]; then
            echo "::error::Repository Actions secret OAIADMIN is missing or empty"
            exit 1
          fi

          scratch="$RUNNER_TEMP/stealtheye-tunnel"
          mkdir -p "$scratch" ops

          api_get() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $OPENAI_ADMIN_KEY" \
              -H 'Content-Type: application/json' \
              "$@"
          }

          # Read the already-published SEZU tunnel only to recover the live
          # organization/workspace scope. It is never updated or deleted.
          api_get "$TUNNEL_API_BASE/v1/tunnels/$SOURCE_TUNNEL_ID" > "$scratch/source.json"

          org_count="$(jq '(.organization_ids // []) | length' "$scratch/source.json")"
          workspace_count="$(jq '(.workspace_ids // []) | length' "$scratch/source.json")"
          if [[ "$org_count" == "0" && "$workspace_count" == "0" ]]; then
            echo "::error::Source tunnel returned no organization_ids or workspace_ids"
            exit 1
          fi

          tunnel_id=""

          # Prefer a previously recorded StealthEye id on retries.
          if [[ -f ops/stealtheye-tunnel.json ]]; then
            tunnel_id="$(jq -r '.id // empty' ops/stealtheye-tunnel.json)"
            if [[ -n "$tunnel_id" ]]; then
              if ! api_get "$TUNNEL_API_BASE/v1/tunnels/$tunnel_id" > "$scratch/target.json"; then
                tunnel_id=""
              fi
            fi
          fi

          # Otherwise find an exact-name tunnel in the same live scope. This
          # protects against duplication if a prior run created the tunnel but
          # failed before recording its metadata.
          if [[ -z "$tunnel_id" ]]; then
            if [[ "$workspace_count" != "0" ]]; then
              scope_id="$(jq -r '.workspace_ids[0]' "$scratch/source.json")"
              api_get --get --data-urlencode "workspace_id=$scope_id" \
                "$TUNNEL_API_BASE/v1/tunnels" > "$scratch/list.json"
            else
              scope_id="$(jq -r '.organization_ids[0]' "$scratch/source.json")"
              api_get --get --data-urlencode "organization_id=$scope_id" \
                "$TUNNEL_API_BASE/v1/tunnels" > "$scratch/list.json"
            fi

            tunnel_id="$(jq -r --arg n "$TUNNEL_NAME" '[.. | objects | select(.name? == $n and (.id? | type == "string")) | .id] | first // empty' "$scratch/list.json")"
            if [[ -n "$tunnel_id" ]]; then
              api_get "$TUNNEL_API_BASE/v1/tunnels/$tunnel_id" > "$scratch/target.json"
            fi
          fi

          if [[ -z "$tunnel_id" ]]; then
            org_json="$(jq -c '.organization_ids // []' "$scratch/source.json")"
            workspace_json="$(jq -c '.workspace_ids // []' "$scratch/source.json")"
            jq -n \
              --arg name "$TUNNEL_NAME" \
              --arg description "$TUNNEL_DESCRIPTION" \
              --argjson org "$org_json" \
              --argjson workspace "$workspace_json" \
              '{name:$name, description:$description}
               + (if ($org|length) > 0 then {organization_ids:$org} else {} end)
               + (if ($workspace|length) > 0 then {workspace_ids:$workspace} else {} end)' \
              > "$scratch/create-body.json"

            curl --fail-with-body --silent --show-error \
              -X POST "$TUNNEL_API_BASE/v1/tunnels" \
              -H "Authorization: Bearer $OPENAI_ADMIN_KEY" \
              -H 'Content-Type: application/json' \
              --data-binary "@$scratch/create-body.json" \
              > "$scratch/create.json"

            tunnel_id="$(jq -r '.id // empty' "$scratch/create.json")"
            if [[ ! "$tunnel_id" =~ ^tunnel_[0-9a-f]{32}$ ]]; then
              echo "::error::Tunnel create returned no valid tunnel id"
              exit 1
            fi
            api_get "$TUNNEL_API_BASE/v1/tunnels/$tunnel_id" > "$scratch/target.json"
          fi

          # Persist only non-secret metadata. The admin key remains exclusively
          # in Actions secret storage and is never used by the runtime daemon.
          jq '{id, name, description, organization_ids, workspace_ids, tenant_ids, status, created_at, updated_at}' \
            "$scratch/target.json" > ops/stealtheye-tunnel.json.tmp
          mv ops/stealtheye-tunnel.json.tmp ops/stealtheye-tunnel.json

          echo "StealthEye tunnel id: $tunnel_id"

      - name: Record non-secret tunnel identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/stealtheye-tunnel.json
          if git diff --cached --quiet; then
            echo 'Tunnel identity already recorded; no commit needed.'
            exit 0
          fi
          git commit -m 'Record StealthEye tunnel identity'
          git push
